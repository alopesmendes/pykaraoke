# Local dev services only — the Django app itself runs on the host via
# `make dev`, pointed at these through DATABASE_URL / EMAIL_URL in .env.
# `make db-up` / `make db-down`. See docs/SETUP.md for the full walkthrough.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pykaraoke
      POSTGRES_PASSWORD: pykaraoke
      POSTGRES_DB: pykaraoke
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pykaraoke -d pykaraoke"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "1025:1025" # SMTP — point EMAIL_URL at this
      - "8025:8025" # web UI — http://localhost:8025

volumes:
  # Named volume, not a bind mount: a bind mount for Postgres data on macOS
  # is slow and permission-cursed. Survives `docker compose down`; wiped only
  # by `docker compose down -v`.
  pgdata:
