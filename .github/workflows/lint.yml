name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # lets the deploy workflows require this to pass before they tag or deploy

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          # Pinned: unpinned, uv picks the newest CPython (3.15 today), which
          # psycopg-binary has no wheel for. 3.13 matches the Dockerfile.
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Same config the local git hook runs, so CI can never disagree with a
      # local run. Not pre-commit/action: it installs its own pre-commit via
      # pip, bypassing the version pinned in uv.lock.
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
