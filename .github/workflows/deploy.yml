name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # No cancel-in-progress: a half-cancelled deploy is worse than a wasted
  # minute — see the github-actions skill.

jobs:
  # Reusable-workflow calls, not duplicated steps: lint.yml / test.yml stay
  # the one place that defines "lint passes" / "tests pass". This gates the
  # build regardless of whether branch protection is ever configured on
  # master — see docs/learning/00-milestone-0-foundation.md, chunk 7.
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN, not a personal access token: auto-scoped to this repo,
      # expires when the job ends, needs nothing to create or rotate.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/alopesmendes/pykaraoke
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Nothing wired to a host yet — that decision lands in Milestone 3 (see
  # the devops skill's "Deploy skeleton" section). Only these two steps
  # should need editing once a provider is chosen; changes anywhere else in
  # this pipeline are a smell.
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: TODO — deploy to staging
        run: echo "Would deploy ${{ needs.build.outputs.image }} to staging"

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: TODO — deploy to production
        run: echo "Would deploy ${{ needs.build.outputs.image }} to production"
