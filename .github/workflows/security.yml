name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday 06:00 UTC. Dependency vulnerabilities can appear with no code
    # change on this repo's side, so pip-audit needs to rerun even when
    # nothing was pushed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # -c is required, or bandit ignores [tool.bandit] and crawls .venv.
      - name: Bandit
        run: uv run bandit -qr . -c pyproject.toml

      - name: pip-audit
        run: uv run pip-audit

      # Scoped to security, same as `make audit`: no real SMTP configured
      # yet, so the unscoped check always fails on mail.E001. Secret key
      # below is the same throwaway value tests/ uses, never a real one.
      - name: Django deploy check
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "LoGfWyqNt1XvFHL13638FhEjHLTKcrUwIyqqAaT-lrp97qUsC_S7Un3QyQVVHJr9fOc"
          DJANGO_ALLOWED_HOSTS: "example.com"
        run: uv run python manage.py check --deploy --tag security --fail-level WARNING
