name: Deploy dev

# Every merge to master is a dev deploy: tested, tagged, then Render is told to
# build that commit. Production is a separate, manual workflow.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  # No cancel-in-progress: a deploy cancelled half-way is worse than one that waits
  # its turn. Two merges in a row queue, so each one gets its own tag.
  cancel-in-progress: false

jobs:
  # Reusable-workflow calls, so lint.yml and test.yml stay the one definition of "passes".
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment:
      name: development
    permissions:
      contents: write # pushes the tag, and only this job needs it
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag script reads every existing tag, so the history must be complete.
          fetch-depth: 0

      - name: Compute next dev tag
        id: version
        run: |
          # Assign first: inside echo, a failing script would write an empty tag and pass.
          tag="$(.github/scripts/next-version.sh dev)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tag the commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # Render builds the image from the repo. ref pins the build to this commit,
      # so a later push cannot slip in between the tag and the build.
      - name: Trigger the Render dev deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}
        run: curl -fsS -X POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}"
