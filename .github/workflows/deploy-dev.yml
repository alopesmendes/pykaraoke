name: Deploy dev

# Every merge to master is a dev deploy, but only after CI passed on that commit. It waits
# for the CI workflow to finish, then deploys only if it succeeded for a push to master.
# Production is a separate, manual workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  # No cancel-in-progress: a deploy cancelled half-way is worse than one that waits
  # its turn. Two merges in a row queue, so each one gets its own tag.
  cancel-in-progress: false

jobs:
  deploy:
    # A schedule run of CI is also on master, so the event check keeps it from deploying.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    environment:
      name: development
    permissions:
      contents: write # pushes the tag, and only this job needs it
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever master points at by now.
          ref: ${{ github.event.workflow_run.head_sha }}
          # The tag script reads every existing tag, so the history must be complete.
          fetch-depth: 0

      - name: Compute next dev tag
        id: version
        run: |
          # Assign first: inside echo, a failing script would write an empty tag and pass.
          tag="$(.github/scripts/next-version.sh dev)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tag the commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"

      # Render builds the image from the repo. ref pins the build to this commit,
      # so a later push cannot slip in between the tag and the build.
      - name: Trigger the Render dev deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: curl -fsS -X POST "${DEPLOY_HOOK}&ref=${SHA}"
