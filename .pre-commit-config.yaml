# Local gate: fast, runs on every `git commit`, skippable with --no-verify.
# CI (lint.yml / test.yml / security.yml) is the authoritative gate that runs
# the same checks (plus tests and the full audit) regardless of whether this
# ran — see docs/CI-CD.md for why both exist.
repos:
  # repo: local reuses this project's own Ruff (pinned once, in pyproject.toml)
  # instead of a separately pinned mirror, so pre-commit can never disagree
  # with `make lint`.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: detect-private-key
